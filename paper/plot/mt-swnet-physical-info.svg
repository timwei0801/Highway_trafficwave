  <circle cx="635" cy="145" r="18" fill="#f1948a" stroke="#666" stroke-width="1"/>
  <text x="635" y="150" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">a</text>

  <circle cx="570" cy="200" r="16" fill="#d7bde2" stroke="#666" stroke-width="1"/>
  <text x="570" y="205" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">d</text>

  <!-- Edges -->
  <line x1="542" y1="117" x2="525" y2="147" stroke="#666" stroke-width="2"/>
