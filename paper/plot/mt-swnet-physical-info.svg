  <text x="130" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Degree Embedding D<tspan baseline-shift="sub" font-size="8">deg</tspan></text>

  <!-- Table header -->
  <text x="55" y="290" font-size="9" font-weight="bold" fill="#333">Node</text>
  <text x="95" y="290" font-size="9" font-weight="bold" fill="#333">In°</text>
  <text x="130" y="290" font-size="9" font-weight="bold" fill="#333">Out°</text>
  <text x="185" y="290" font-size="9" font-weight="bold" fill="#333">Embedding</text>

  <line x1="40" y1="297" x2="220" y2="297" stroke="#ccc" stroke-width="1"/>

