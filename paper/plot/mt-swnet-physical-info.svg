  <!-- Nodes -->
  <circle cx="555" cy="105" r="16" fill="#f9e79f" stroke="#666" stroke-width="1"/>
  <text x="555" y="110" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">c</text>

  <circle cx="515" cy="160" r="16" fill="#d5f5e3" stroke="#666" stroke-width="1"/>
