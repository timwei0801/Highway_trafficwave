  <text x="95" y="313" font-size="9" fill="#333">3</text>
  <text x="130" y="313" font-size="9" fill="#333">1</text>
  <rect x="165" y="302" width="50" height="14" rx="0" fill="#f1948a" stroke="#666" stroke-width="0.5"/>

