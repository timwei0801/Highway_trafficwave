  <text x="95" y="347" font-size="9" fill="#333">0</text>
  <text x="130" y="347" font-size="9" fill="#333">2</text>
  <rect x="165" y="336" width="50" height="14" rx="0" fill="#f9e79f" stroke="#666" stroke-width="0.5"/>


  <!-- ==================== SECTION 5: Integration Formula ==================== -->

  <rect x="255" y="245" width="210" height="115" rx="0" fill="none" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="5,3"/>

  <text x="360" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Integration in Attention</text>

  <text x="270" y="295" font-size="10" fill="#333">① Input:</text>
  <text x="320" y="295" font-size="10" font-style="italic" fill="#555">X' = X + STE + D<tspan baseline-shift="sub" font-size="7">deg</tspan></text>

  <text x="270" y="320" font-size="10" fill="#333">② Score:</text>
  <text x="320" y="320" font-size="10" font-style="italic" fill="#555">A += D<tspan baseline-shift="sub" font-size="7">dist</tspan></text>

  <text x="270" y="345" font-size="10" fill="#333">③ Score:</text>
  <text x="320" y="345" font-size="10" font-style="italic" fill="#555">A += SP · W<tspan baseline-shift="sub" font-size="7">n</tspan></text>


