  <text x="360" y="215" text-anchor="middle" font-size="9" fill="#666">Learned via W<tspan baseline-shift="sub" font-size="7">n</tspan></text>


  <!-- ==================== SECTION 3: Network Graph ==================== -->

  <rect x="485" y="50" width="210" height="175" rx="0" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,3"/>

