  <text x="532" y="188" font-size="9" fill="#333">4</text>

  <line x1="584" y1="193" x2="620" y2="160" stroke="#666" stroke-width="2"/>
  <text x="612" y="183" font-size="9" fill="#333">1</text>

  <text x="590" y="218" text-anchor="middle" font-size="9" fill="#666">Edge weights in km</text>


  <!-- ==================== SECTION 4: Degree Embedding ==================== -->

