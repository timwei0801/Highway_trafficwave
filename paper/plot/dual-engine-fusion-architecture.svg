<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450">
  <defs>
    <!-- Gradients -->
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="decisionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="physicsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fusionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>

    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="450" fill="#FAFBFC"/>

  <!-- Title -->
  <text x="550" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2C3E50">Dual-Engine Fusion Architecture</text>

  <!-- Input Box: Real-time Traffic Data -->
  <g filter="url(#shadow)">
    <rect x="30" y="170" width="140" height="110" rx="8" fill="url(#inputGrad)"/>
  </g>
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Real-time</text>
  <text x="100" y="218" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Traffic Data</text>
  <text x="100" y="242" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.9)">• ETC Gantries</text>
  <text x="100" y="256" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.9)">• Vehicle Detectors</text>
  <text x="100" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.9)">• Road Sensors</text>

  <!-- Decision Diamond: Dynamic Model Selection -->
  <g filter="url(#shadow)">
    <polygon points="310,225 385,160 460,225 385,290" fill="url(#decisionGrad)"/>
  </g>
  <text x="385" y="210" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Dynamic</text>
  <text x="385" y="226" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Model</text>
  <text x="385" y="242" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Selection</text>

  <!-- Upper Path Label -->
  <text x="440" y="105" font-family="Arial, sans-serif" font-size="11" fill="#666">Normal Traffic Flow</text>
  <text x="440" y="120" font-family="Arial, sans-serif" font-size="11" fill="#666">Stable Conditions</text>

  <!-- Lower Path Label -->
  <text x="440" y="345" font-family="Arial, sans-serif" font-size="11" fill="#666">Shockwave Event</text>
  <text x="440" y="360" font-family="Arial, sans-serif" font-size="11" fill="#666">Anomaly Detected</text>

  <!-- Deep Learning Engine Box -->
  <g filter="url(#shadow)">
    <rect x="540" y="70" width="200" height="140" rx="10" fill="url(#dlGrad)"/>
  </g>
  <text x="640" y="98" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Deep Learning Engine</text>
  <text x="640" y="118" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="rgba(255,255,255,0.95)">MT-SWNet</text>
  <line x1="570" y1="128" x2="710" y2="128" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="640" y="148" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.9)">• ST-Physical Attention</text>
  <text x="640" y="164" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.9)">• Multi-Task Learning</text>
  <text x="640" y="180" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.9)">• Iterative Bridge Attention</text>
  <text x="640" y="196" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.9)">• 60-min Prediction</text>

  <!-- Physics Engine Box -->
  <g filter="url(#shadow)">
    <rect x="540" y="250" width="200" height="140" rx="10" fill="url(#physicsGrad)"/>
  </g>
  <text x="640" y="278" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Physics Engine</text>
  <text x="640" y="298" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="rgba(255,255,255,0.95)">LWR Shockwave Model</text>
  <line x1="570" y1="308" x2="710" y2="308" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="640" y="328" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.9)">• Rankine-Hugoniot Condition</text>
  <text x="640" y="344" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.9)">• Shockwave Velocity Calc</text>
  <text x="640" y="360" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.9)">• Lax Entropy Validation</text>
  <text x="640" y="376" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.9)">• Propagation Prediction</text>

  <!-- Fusion Box -->
  <g filter="url(#shadow)">
    <rect x="800" y="170" width="130" height="110" rx="8" fill="url(#fusionGrad)"/>
  </g>
  <text x="865" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Fusion Module</text>
  <line x1="820" y1="210" x2="910" y2="210" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="865" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.9)">Prediction Results</text>
  <text x="865" y="246" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.9)">Confidence Score</text>
  <text x="865" y="262" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.9)">Decision Support</text>

  <!-- Output Boxes -->
  <g filter="url(#shadow)">
    <rect x="990" y="140" width="90" height="50" rx="6" fill="url(#outputGrad)"/>
  </g>
  <text x="1035" y="162" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Real-time</text>
  <text x="1035" y="178" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Alert</text>

  <g filter="url(#shadow)">
    <rect x="990" y="260" width="90" height="50" rx="6" fill="url(#outputGrad)"/>
  </g>
  <text x="1035" y="282" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Management</text>
  <text x="1035" y="298" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Decision</text>

  <!-- Arrows -->
  <!-- Input to Decision -->
  <line x1="170" y1="225" x2="305" y2="225" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Decision to Deep Learning (upper path) -->
  <path d="M 420 178 Q 480 135, 535 135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Decision to Physics (lower path) -->
  <path d="M 420 272 Q 480 315, 535 315" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Deep Learning to Fusion -->
  <path d="M 740 135 Q 780 135, 780 195 L 795 195" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Physics to Fusion -->
  <path d="M 740 315 Q 780 315, 780 255 L 795 255" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Fusion to Outputs -->
  <path d="M 930 200 Q 960 165, 985 165" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 930 250 Q 960 285, 985 285" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Legend Box -->
  <rect x="30" y="390" width="340" height="40" rx="5" fill="white" stroke="#DDD" stroke-width="1"/>
  <text x="50" y="410" font-family="Arial, sans-serif" font-size="10" fill="#666">Legend:</text>
  <rect x="100" y="400" width="15" height="15" fill="url(#dlGrad)" rx="2"/>
  <text x="120" y="412" font-family="Arial, sans-serif" font-size="10" fill="#666">Deep Learning</text>
  <rect x="200" y="400" width="15" height="15" fill="url(#physicsGrad)" rx="2"/>
  <text x="220" y="412" font-family="Arial, sans-serif" font-size="10" fill="#666">Physics-based</text>
  <rect x="310" y="400" width="15" height="15" fill="url(#fusionGrad)" rx="2"/>
  <text x="330" y="412" font-family="Arial, sans-serif" font-size="10" fill="#666">Fusion</text>

  <!-- Feedback Loop (dashed) -->
  <path d="M 865 280 L 865 400 L 385 400 L 385 295" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="625" y="418" font-family="Arial, sans-serif" font-size="10" fill="#888" text-anchor="middle">Feedback Loop: Model Adaptation</text>
</svg>
