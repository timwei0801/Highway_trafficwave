<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <defs>
    <linearGradient id="matmulGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D"/>
      <stop offset="100%" style="stop-color:#FF9800"/>
    </linearGradient>
    <linearGradient id="softmaxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFCC80"/>
      <stop offset="100%" style="stop-color:#FFB300"/>
    </linearGradient>
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81D4FA"/>
      <stop offset="100%" style="stop-color:#29B6F6"/>
    </linearGradient>
    <linearGradient id="linearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B3E5FC"/>
      <stop offset="100%" style="stop-color:#81D4FA"/>
    </linearGradient>
    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="5" refY="10" orient="auto">
      <path d="M 0 10 L 5 0 L 10 10" fill="none" stroke="#546E7A" stroke-width="1.5"/>
    </marker>
    <marker id="arrowRight" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#546E7A" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="900" height="450" fill="#FFFFFF"/>

  <!-- Left Part: Attention Mechanism -->

  <!-- Node representation (bottom) -->
  <rect x="30" y="380" width="30" height="20" fill="#4DB6AC" stroke="#00897B" stroke-width="1"/>
  <rect x="65" y="380" width="30" height="20" fill="#4DB6AC" stroke="#00897B" stroke-width="1"/>
  <rect x="100" y="380" width="30" height="20" fill="#4DB6AC" stroke="#00897B" stroke-width="1"/>
  <text x="82" y="420" font-family="Arial, sans-serif" font-size="11" fill="#37474F" text-anchor="middle">Node representation</text>

  <!-- Arrows from node to Linear layers -->
  <line x1="45" y1="380" x2="45" y2="355" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrowUp)"/>
  <line x1="80" y1="380" x2="80" y2="355" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrowUp)"/>
  <line x1="115" y1="380" x2="115" y2="355" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrowUp)"/>

  <!-- Linear layers -->
  <rect x="25" y="320" width="50" height="30" rx="4" fill="url(#linearGrad)" stroke="#0288D1" stroke-width="1.5"/>
  <text x="50" y="340" font-family="Arial, sans-serif" font-size="10" fill="#01579B" text-anchor="middle">Linear</text>

  <rect x="85" y="320" width="50" height="30" rx="4" fill="url(#linearGrad)" stroke="#0288D1" stroke-width="1.5"/>
  <text x="110" y="340" font-family="Arial, sans-serif" font-size="10" fill="#01579B" text-anchor="middle">Linear</text>

  <rect x="145" y="320" width="50" height="30" rx="4" fill="url(#linearGrad)" stroke="#0288D1" stroke-width="1.5"/>
  <text x="170" y="340" font-family="Arial, sans-serif" font-size="10" fill="#01579B" text-anchor="middle">Linear</text>

  <!-- W_Q, W_K, W_V labels -->
  <text x="50" y="365" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">W_Q</text>
  <text x="110" y="365" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">W_K</text>
  <text x="170" y="365" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">W_V</text>

  <!-- Arrows from Linear to Matmul -->
  <line x1="50" y1="320" x2="50" y2="295" stroke="#546E7A" stroke-width="1.5"/>
  <line x1="50" y1="295" x2="90" y2="275" stroke="#546E7A" stroke-width="1.5"/>
  <line x1="110" y1="320" x2="110" y2="295" stroke="#546E7A" stroke-width="1.5"/>
  <line x1="110" y1="295" x2="110" y2="275" stroke="#546E7A" stroke-width="1.5"/>

  <!-- First Matmul -->
  <rect x="70" y="240" width="80" height="30" rx="4" fill="url(#matmulGrad)" stroke="#E65100" stroke-width="1.5"/>
  <text x="110" y="260" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Matmul</text>

  <!-- Arrow from first Matmul to Scale -->
  <line x1="110" y1="240" x2="110" y2="215" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrowUp)"/>

  <!-- Scale -->
  <rect x="70" y="180" width="80" height="30" rx="4" fill="url(#scaleGrad)" stroke="#0277BD" stroke-width="1.5"/>
  <text x="110" y="200" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#01579B" text-anchor="middle">Scale</text>

  <!-- Plus circle and connection -->
  <circle cx="110" cy="145" r="12" fill="#FFFFFF" stroke="#546E7A" stroke-width="1.5"/>
  <text x="110" y="150" font-family="Arial, sans-serif" font-size="14" fill="#546E7A" text-anchor="middle">+</text>

  <line x1="110" y1="180" x2="110" y2="157" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrowUp)"/>

  <!-- SoftMax -->
  <rect x="70" y="95" width="80" height="30" rx="4" fill="url(#softmaxGrad)" stroke="#FF8F00" stroke-width="1.5"/>
  <text x="110" y="115" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E65100" text-anchor="middle">SoftMax</text>

  <line x1="110" y1="133" x2="110" y2="125" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrowUp)"/>

  <!-- Top Matmul -->
  <rect x="70" y="40" width="80" height="30" rx="4" fill="url(#matmulGrad)" stroke="#E65100" stroke-width="1.5"/>
  <text x="110" y="60" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Matmul</text>

  <line x1="110" y1="95" x2="110" y2="70" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrowUp)"/>

  <!-- V path to top Matmul -->
  <line x1="170" y1="320" x2="170" y2="55" stroke="#546E7A" stroke-width="1.5"/>
  <line x1="170" y1="55" x2="150" y2="55" stroke="#546E7A" stroke-width="1.5" marker-end="url(#arrowRight)"/>

  <!-- xW label and arrow to plus -->
  <text x="175" y="148" font-family="Arial, sans-serif" font-size="12" fill="#546E7A">x W</text>
  <line x1="165" y1="145" x2="122" y2="145" stroke="#546E7A" stroke-width="1.5"/>

  <!-- Middle Part: Matrices -->

  <!-- Shortest path distance matrix -->
  <text x="360" y="35" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">a</text>
  <text x="390" y="35" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">b</text>
  <text x="420" y="35" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">c</text>
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">d</text>

  <text x="335" y="65" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">a</text>
  <text x="335" y="95" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">b</text>
  <text x="335" y="125" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">c</text>
  <text x="335" y="155" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">d</text>

  <!-- Matrix grid -->
  <rect x="345" y="45" width="120" height="120" fill="none" stroke="#546E7A" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="345" y="45" width="30" height="30" fill="#81D4FA" stroke="#546E7A" stroke-width="0.5"/>
  <text x="360" y="65" font-family="Arial, sans-serif" font-size="9" fill="#37474F" text-anchor="middle">inf</text>
  <rect x="375" y="45" width="30" height="30" fill="#4FC3F7" stroke="#546E7A" stroke-width="0.5"/>
  <text x="390" y="65" font-family="Arial, sans-serif" font-size="10" fill="#37474F" text-anchor="middle">4</text>
  <rect x="405" y="45" width="30" height="30" fill="#81D4FA" stroke="#546E7A" stroke-width="0.5"/>
  <text x="420" y="65" font-family="Arial, sans-serif" font-size="9" fill="#37474F" text-anchor="middle">inf</text>
  <rect x="435" y="45" width="30" height="30" fill="#81D4FA" stroke="#546E7A" stroke-width="0.5"/>
  <text x="450" y="65" font-family="Arial, sans-serif" font-size="9" fill="#37474F" text-anchor="middle">inf</text>

  <!-- Row 2 -->
  <rect x="345" y="75" width="30" height="30" fill="#81D4FA" stroke="#546E7A" stroke-width="0.5"/>
  <text x="360" y="95" font-family="Arial, sans-serif" font-size="9" fill="#37474F" text-anchor="middle">inf</text>
  <rect x="375" y="75" width="30" height="30" fill="#81D4FA" stroke="#546E7A" stroke-width="0.5"/>
  <text x="390" y="95" font-family="Arial, sans-serif" font-size="9" fill="#37474F" text-anchor="middle">inf</text>
  <rect x="405" y="75" width="30" height="30" fill="#81D4FA" stroke="#546E7A" stroke-width="0.5"/>
  <text x="420" y="95" font-family="Arial, sans-serif" font-size="9" fill="#37474F" text-anchor="middle">inf</text>
  <rect x="435" y="75" width="30" height="30" fill="#81D4FA" stroke="#546E7A" stroke-width="0.5"/>
  <text x="450" y="95" font-family="Arial, sans-serif" font-size="9" fill="#37474F" text-anchor="middle">inf</text>

  <!-- Row 3 -->
  <rect x="345" y="105" width="30" height="30" fill="#4FC3F7" stroke="#546E7A" stroke-width="0.5"/>
  <text x="360" y="125" font-family="Arial, sans-serif" font-size="10" fill="#37474F" text-anchor="middle">3</text>
  <rect x="375" y="105" width="30" height="30" fill="#29B6F6" stroke="#546E7A" stroke-width="0.5"/>
  <text x="390" y="125" font-family="Arial, sans-serif" font-size="10" fill="#37474F" text-anchor="middle">2</text>
  <rect x="405" y="105" width="30" height="30" fill="#81D4FA" stroke="#546E7A" stroke-width="0.5"/>
  <text x="420" y="125" font-family="Arial, sans-serif" font-size="9" fill="#37474F" text-anchor="middle">inf</text>
  <rect x="435" y="105" width="30" height="30" fill="#81D4FA" stroke="#546E7A" stroke-width="0.5"/>
  <text x="450" y="125" font-family="Arial, sans-serif" font-size="9" fill="#37474F" text-anchor="middle">inf</text>

  <!-- Row 4 -->
  <rect x="345" y="135" width="30" height="30" fill="#03A9F4" stroke="#546E7A" stroke-width="0.5"/>
  <text x="360" y="155" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">1</text>
  <rect x="375" y="135" width="30" height="30" fill="#0288D1" stroke="#546E7A" stroke-width="0.5"/>
  <text x="390" y="155" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">5</text>
  <rect x="405" y="135" width="30" height="30" fill="#0277BD" stroke="#546E7A" stroke-width="0.5"/>
  <text x="420" y="155" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">7</text>
  <rect x="435" y="135" width="30" height="30" fill="#81D4FA" stroke="#546E7A" stroke-width="0.5"/>
  <text x="450" y="155" font-family="Arial, sans-serif" font-size="9" fill="#37474F" text-anchor="middle">inf</text>

  <text x="405" y="185" font-family="Arial, sans-serif" font-size="11" fill="#37474F" text-anchor="middle">Shortest path distance</text>

  <!-- Edge embedding matrix -->
  <text x="360" y="220" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">a</text>
  <text x="390" y="220" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">b</text>
  <text x="420" y="220" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">c</text>
  <text x="450" y="220" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">d</text>

  <text x="335" y="250" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">a</text>
  <text x="335" y="280" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">b</text>
  <text x="335" y="310" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">c</text>
  <text x="335" y="340" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">d</text>

  <rect x="345" y="230" width="120" height="120" fill="none" stroke="#546E7A" stroke-width="1"/>

  <!-- Edge embedding colors -->
  <rect x="345" y="230" width="30" height="30" fill="#E0E0E0" stroke="#546E7A" stroke-width="0.5"/>
  <rect x="375" y="230" width="30" height="30" fill="#81C784" stroke="#546E7A" stroke-width="0.5"/>
  <rect x="405" y="230" width="30" height="30" fill="#E0E0E0" stroke="#546E7A" stroke-width="0.5"/>
  <rect x="435" y="230" width="30" height="30" fill="#E0E0E0" stroke="#546E7A" stroke-width="0.5"/>

  <rect x="345" y="260" width="30" height="30" fill="#E0E0E0" stroke="#546E7A" stroke-width="0.5"/>
  <rect x="375" y="260" width="30" height="30" fill="#E0E0E0" stroke="#546E7A" stroke-width="0.5"/>
  <rect x="405" y="260" width="30" height="30" fill="#CE93D8" stroke="#546E7A" stroke-width="0.5"/>
  <rect x="435" y="260" width="30" height="30" fill="#E0E0E0" stroke="#546E7A" stroke-width="0.5"/>

  <rect x="345" y="290" width="30" height="30" fill="#E0E0E0" stroke="#546E7A" stroke-width="0.5"/>
  <rect x="375" y="290" width="30" height="30" fill="#E0E0E0" stroke="#546E7A" stroke-width="0.5"/>
  <rect x="405" y="290" width="30" height="30" fill="#E0E0E0" stroke="#546E7A" stroke-width="0.5"/>
  <rect x="435" y="290" width="30" height="30" fill="#4FC3F7" stroke="#546E7A" stroke-width="0.5"/>

  <rect x="345" y="320" width="30" height="30" fill="#E0E0E0" stroke="#546E7A" stroke-width="0.5"/>
  <rect x="375" y="320" width="30" height="30" fill="#E0E0E0" stroke="#546E7A" stroke-width="0.5"/>
  <rect x="405" y="320" width="30" height="30" fill="#E0E0E0" stroke="#546E7A" stroke-width="0.5"/>
  <rect x="435" y="320" width="30" height="30" fill="#3F51B5" stroke="#546E7A" stroke-width="0.5"/>

  <text x="405" y="370" font-family="Arial, sans-serif" font-size="11" fill="#37474F" text-anchor="middle">Edge embedding</text>

  <!-- Degree embedding legend -->
  <rect x="205" y="380" width="25" height="18" fill="#4DB6AC" stroke="#00897B" stroke-width="1"/>
  <rect x="235" y="380" width="25" height="18" fill="#9E9E9E" stroke="#757575" stroke-width="1"/>
  <rect x="265" y="380" width="25" height="18" fill="#78909C" stroke="#546E7A" stroke-width="1"/>

  <circle cx="215" cy="412" r="8" fill="none" stroke="#546E7A" stroke-width="1.5"/>
  <text x="218" y="416" font-family="Arial, sans-serif" font-size="10" fill="#546E7A">+</text>
  <text x="255" y="420" font-family="Arial, sans-serif" font-size="11" fill="#37474F" text-anchor="middle">Degree embedding</text>

  <!-- Right Part: Graph Visualization -->

  <!-- Node c (yellow, top) -->
  <circle cx="760" cy="100" r="18" fill="#FFEB3B" stroke="#FBC02D" stroke-width="2"/>
  <text x="760" y="75" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#37474F" text-anchor="middle">c</text>

  <!-- Node b (blue circle, left) -->
  <circle cx="680" cy="200" r="18" fill="#2196F3" stroke="#1976D2" stroke-width="2"/>
  <text x="655" y="205" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#37474F" text-anchor="middle">b</text>

  <!-- Node a (red/pink, right) -->
  <circle cx="820" cy="200" r="18" fill="#E91E63" stroke="#C2185B" stroke-width="2"/>
  <text x="845" y="205" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#37474F" text-anchor="middle">a</text>

  <!-- Node d (star, bottom) -->
  <polygon points="750,320 753,310 763,310 755,303 758,293 750,298 742,293 745,303 737,310 747,310" fill="#9C27B0" stroke="#7B1FA2" stroke-width="1"/>
  <text x="750" y="345" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#37474F" text-anchor="middle">d</text>

  <!-- Blue triangle marker near b -->
  <polygon points="710,230 715,220 720,230" fill="#2196F3" stroke="#1976D2" stroke-width="1"/>

  <!-- Edges with distances -->
  <!-- c to b (2 km) - cyan -->
  <line x1="745" y1="112" x2="695" y2="185" stroke="#00BCD4" stroke-width="2"/>
  <text x="705" y="140" font-family="Arial, sans-serif" font-size="10" fill="#00838F">2 km</text>

  <!-- c to a (3 km) - magenta -->
  <line x1="775" y1="112" x2="805" y2="185" stroke="#E91E63" stroke-width="2"/>
  <text x="805" y="140" font-family="Arial, sans-serif" font-size="10" fill="#AD1457">3 km</text>

  <!-- b to a (7 km) - green -->
  <line x1="698" y1="200" x2="802" y2="200" stroke="#4CAF50" stroke-width="2"/>
  <text x="750" y="190" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">7 km</text>

  <!-- b to d (4 km) - yellow -->
  <line x1="680" y1="218" x2="745" y2="295" stroke="#FFC107" stroke-width="2"/>
  <text x="695" y="265" font-family="Arial, sans-serif" font-size="10" fill="#FF8F00">4 km</text>

  <!-- a to d (1 km) - purple -->
  <line x1="805" y1="215" x2="760" y2="295" stroke="#9C27B0" stroke-width="2"/>
  <text x="800" y="265" font-family="Arial, sans-serif" font-size="10" fill="#6A1B9A">1 km</text>

  <!-- Connection line from matrices to plus -->
  <path d="M 345 145 L 200 145" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="4,2"/>

</svg>
